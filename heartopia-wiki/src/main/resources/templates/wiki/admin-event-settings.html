<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/common-head :: common_head}"></th:block>
    <style>
        .event-settings-admin {
            width: min(920px, calc(100% - 32px));
            margin: 16px auto 56px;
        }

        .event-settings-admin__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .event-settings-card {
            padding: 24px;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            background: var(--card-bg);
            box-shadow: 0 8px 28px var(--shadow);
        }

        .event-settings-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 20px 0 16px;
        }

        .event-settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .event-settings-group + .event-settings-group {
            margin-top: 30px;
            padding-top: 28px;
            border-top: 1px solid var(--border-color);
        }

        .event-settings-option {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--filter-bg);
            cursor: pointer;
        }

        .event-settings-option:has(input:checked) {
            border-color: #f0a53a;
            background: rgba(255, 193, 7, 0.12);
        }

        .event-settings-option input {
            width: 18px;
            height: 18px;
            accent-color: #e89a27;
        }

        .event-settings-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }

        @media (max-width: 720px) {
            .event-settings-admin {
                margin-top: 16px;
            }

            .event-settings-admin__header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="event-settings-admin">
        <div class="event-settings-admin__header">
            <div>
                <p class="text-secondary mb-1">ADMIN · 도감 이벤트 노출</p>
                <h1 class="h2 mb-0"><i class="fa-solid fa-calendar-check text-warning me-2"></i>이벤트 필터 관리</h1>
            </div>
            <a th:href="@{/wiki}" class="btn btn-outline-secondary btn-sm">메인으로</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <section class="event-settings-card" aria-labelledby="event-settings-title">
            <h2 id="event-settings-title" class="h5 mb-2">도감 이벤트 설정</h2>

            <form th:action="@{/wiki/admin/event-settings}" method="post" id="eventSettingsForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="eventSettingsVersion" value="2">

                <div class="event-settings-group" data-event-settings-group="current" th:unless="${#lists.isEmpty(availableEventNames)}">
                    <h3 class="h6 mb-1">기본으로 보여줄 현재 이벤트</h3>
                    <p class="text-secondary small mb-0">일반 항목과 함께 최초 화면에 표시됩니다.</p>
                    <div class="event-settings-toolbar">
                        <strong><span data-selected-count>0</span>개 선택됨</strong>
                        <div class="btn-group btn-group-sm" role="group" aria-label="현재 이벤트 선택 도구">
                            <button type="button" class="btn btn-outline-secondary" data-select-all>전체 선택</button>
                            <button type="button" class="btn btn-outline-secondary" data-clear-all>전체 해제</button>
                        </div>
                    </div>
                    <div class="event-settings-grid">
                        <label class="event-settings-option" th:each="eventName, stat : ${availableEventNames}">
                            <input type="checkbox" name="currentEventNames" th:id="${'current-event-' + stat.index}"
                                   th:value="${eventName}" th:checked="${#lists.contains(currentEventNames, eventName)}">
                            <span th:text="${eventName}">이벤트명</span>
                        </label>
                    </div>
                </div>

                <div class="event-settings-group" data-event-settings-group="quick" th:unless="${#lists.isEmpty(availableEventNames)}">
                    <h3 class="h6 mb-1">상단 빠른 선택에 표시할 이벤트</h3>
                    <p class="text-secondary small mb-0">종료된 이벤트도 등록할 수 있으며, 사용자가 상단 드롭다운에서 복수 선택합니다.</p>
                    <div class="event-settings-toolbar">
                        <strong><span data-selected-count>0</span>개 선택됨</strong>
                        <div class="btn-group btn-group-sm" role="group" aria-label="빠른 이벤트 선택 도구">
                            <button type="button" class="btn btn-outline-secondary" data-select-all>전체 선택</button>
                            <button type="button" class="btn btn-outline-secondary" data-clear-all>전체 해제</button>
                        </div>
                    </div>
                    <div class="event-settings-grid">
                        <label class="event-settings-option" th:each="eventName, stat : ${availableEventNames}">
                            <input type="checkbox" name="quickEventNames" th:id="${'quick-event-' + stat.index}"
                                   th:value="${eventName}" th:checked="${#lists.contains(quickEventNames, eventName)}">
                            <span th:text="${eventName}">이벤트명</span>
                        </label>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(availableEventNames)}" class="alert alert-light border mt-4 mb-0">
                    도감 데이터에 등록된 이벤트명이 없습니다. 각 도감의 관리자 편집에서 이벤트명을 먼저 등록해 주세요.
                </div>

                <div class="event-settings-actions">
                    <button type="submit" class="btn btn-primary px-4">이벤트 설정 저장</button>
                </div>
            </form>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('[data-event-settings-group]').forEach(group => {
                const checkboxes = Array.from(group.querySelectorAll('input[type="checkbox"]'));
                const count = group.querySelector('[data-selected-count]');
                const updateCount = () => {
                    if (count) count.textContent = String(checkboxes.filter(checkbox => checkbox.checked).length);
                };
                checkboxes.forEach(checkbox => checkbox.addEventListener('change', updateCount));
                group.querySelector('[data-select-all]')?.addEventListener('click', () => {
                    checkboxes.forEach(checkbox => checkbox.checked = true);
                    updateCount();
                });
                group.querySelector('[data-clear-all]')?.addEventListener('click', () => {
                    checkboxes.forEach(checkbox => checkbox.checked = false);
                    updateCount();
                });
                updateCount();
            });
        });
    </script>
</body>

</html>
