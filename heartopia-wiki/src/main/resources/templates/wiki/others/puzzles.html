<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/common-head :: common_head}"></th:block>
    <script src="/js/wiki-filter.js?v=2.5" defer></script>
    <style>
        .puzzle-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 0 20px;
        }

        .puzzle-summary span {
            padding: 7px 12px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .puzzle-image {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 12px;
        }

        .puzzle-order {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(40, 30, 20, 0.72);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .puzzle-category {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(255, 183, 77, 0.18);
            color: #a25b00;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .puzzle-image-fallback {
            display: none;
            min-height: 180px;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 3rem;
        }

        [data-theme='dark'] .puzzle-category {
            color: #ffd08a;
        }

        @media (max-width: 640px) {
            main.mw-body {
                padding-top: 2rem;
            }

            .wiki-grid-layout {
                grid-template-columns: 1fr;
            }

            .puzzle-image {
                height: 150px;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="mw-body">
        <div class="page-header">
            <i class="fas fa-puzzle-piece fa-2x text-warning"></i>
            <h1>퍼즐 도감</h1>
        </div>
        <p class="text-secondary mb-3">이미지와 한국어 정보가 확인된 퍼즐의 크기와 획득처를 모았습니다.</p>

        <div class="puzzle-summary">
            <span><i class="fas fa-layer-group me-1"></i> 전체 <strong th:text="${#lists.size(puzzleList)}">80</strong>개</span>
            <span><i class="fas fa-store me-1"></i> 잡화점·꿈·동물 친밀도 획득처</span>
        </div>

        <div class="wiki-filter-container">
            <div class="filter-top-tier">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="퍼즐 이름 검색...">
                </div>

                <button type="button" class="btn-filter-toggle"
                        onclick="document.getElementById('advancedFilters').classList.toggle('show')">
                    <i class="fas fa-sliders-h"></i> 상세 옵션
                    <i class="fas fa-chevron-down ms-1"></i>
                </button>

                <button type="button" id="resetBtn" class="btn-reset-icon" title="필터 초기화">
                    <i class="fas fa-undo"></i>
                </button>
            </div>

            <div class="filter-advanced-tier" id="advancedFilters">
                <div class="advanced-section">
                    <div class="section-label"><i class="fas fa-filter"></i> 조건 검색</div>
                    <div class="advanced-controls-box">
                        <div class="filter-select-wrapper">
                            <span class="prefix">분류</span>
                            <select id="categoryFilter" data-filter="category" aria-label="퍼즐 분류">
                                <option value="all">모든 분류</option>
                                <option value="일반">일반</option>
                                <option value="동물">동물</option>
                                <option value="고래 탐사 시즌">고래 탐사 시즌</option>
                            </select>
                        </div>

                        <div class="filter-select-wrapper">
                            <span class="prefix">크기</span>
                            <select id="sizeFilter" data-filter="size" aria-label="퍼즐 크기">
                                <option value="all">모든 크기</option>
                                <option value="1x1">1x1</option>
                                <option value="2x2">2x2</option>
                                <option value="3x3">3x3</option>
                                <option value="4x4">4x4</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="advanced-divider"></div>

                <div class="advanced-section">
                    <div class="section-label">
                        <i class="fas fa-sort-amount-down"></i> 결과 정렬 및 보기
                    </div>
                    <div class="advanced-controls-box">
                        <div class="d-flex w-100 flex-wrap justify-content-between align-items-center mb-1">
                            <div class="sort-group" id="sortGroup">
                                <button class="sort-chip active" data-sort="default">
                                    <i class="fas fa-asterisk"></i> 도감순
                                </button>
                                <button class="sort-chip" data-sort="name">
                                    <i class="fas fa-sort-alpha-down"></i> 이름순
                                </button>
                            </div>

                            <div class="vr d-none d-md-block mx-1"></div>

                            <div class="btn-group shadow-sm ms-auto" role="group" id="viewToggle">
                                <button type="button" class="btn btn-outline-secondary view-toggle-btn active"
                                        data-view="card" title="카드 뷰">
                                    <i class="fas fa-th-large"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary view-toggle-btn"
                                        data-view="table" title="테이블 뷰">
                                    <i class="fas fa-list"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="wiki-grid-layout" id="wikiGrid">
            <div th:each="puzzle, iterStat : ${puzzleList}"
                 class="wiki-item-card"
                 th:data-id="${puzzle.sortOrder}"
                 th:data-name="${puzzle.name}"
                 th:data-category="${puzzle.category}"
                 th:data-size="${puzzle.size}">
                <div class="wiki-item-image" style="position:relative;">
                    <span class="puzzle-order" th:text="'#' + ${puzzle.catalogOrder}">#1</span>
                    <img class="puzzle-image"
                         th:src="${puzzle.imageUrl}"
                         th:alt="${puzzle.name}"
                         loading="lazy"
                         decoding="async"
                         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                    <div class="puzzle-image-fallback" aria-hidden="true">
                        <i class="fas fa-puzzle-piece"></i>
                    </div>
                </div>

                <div class="wiki-item-info">
                    <div class="wiki-item-name mb-1" th:text="${puzzle.name}">퍼즐 이름</div>
                    <span class="puzzle-category" th:text="${puzzle.category}">일반</span>
                </div>

                <table class="wiki-item-stats">
                    <tr>
                        <td class="stat-label">크기</td>
                        <td class="stat-value" th:text="${puzzle.size}">1x1</td>
                    </tr>
                    <tr>
                        <td class="stat-label">획득처</td>
                        <td class="stat-value" th:text="${puzzle.acquisitionMethod}">잡화점,버블</td>
                    </tr>
                    <tr>
                        <td class="stat-label">구매가격</td>
                        <td class="stat-value"
                            th:text="${puzzle.purchasePrice != null and !puzzle.purchasePrice.isBlank() ? puzzle.purchasePrice : '-'}">-</td>
                    </tr>
                </table>
            </div>

            <div class="no-results" id="noResults">
                <i class="fas fa-search fa-3x mb-3 text-muted"></i>
                <p>조건에 맞는 퍼즐이 없습니다.</p>
            </div>
        </div>

        <div class="wiki-table-container" id="wikiTable">
            <table class="wiki-table-layout">
                <thead>
                    <tr>
                        <th>도감순</th>
                        <th></th>
                        <th>이름</th>
                        <th>분류</th>
                        <th>크기</th>
                        <th>획득처</th>
                        <th>구매가격</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="puzzle : ${puzzleList}"
                        class="wiki-table-row"
                        th:data-id="${puzzle.sortOrder}"
                        th:data-name="${puzzle.name}"
                        th:data-category="${puzzle.category}"
                        th:data-size="${puzzle.size}">
                        <td th:text="${puzzle.catalogOrder}">1</td>
                        <td>
                            <img th:src="${puzzle.imageUrl}" th:alt="${puzzle.name}"
                                 class="table-thumb" loading="lazy" decoding="async">
                        </td>
                        <td><span class="table-name-link" th:text="${puzzle.name}">이름</span></td>
                        <td th:text="${puzzle.category}">일반</td>
                        <td th:text="${puzzle.size}">1x1</td>
                        <td th:text="${puzzle.acquisitionMethod}">획득처</td>
                        <td th:text="${puzzle.purchasePrice != null and !puzzle.purchasePrice.isBlank() ? puzzle.purchasePrice : '-'}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            new WikiFilter({
                gridId: 'wikiGrid',
                tableId: 'wikiTable',
                itemSelector: '.wiki-item-card',
                filters: [
                    { id: 'categoryFilter', dataKey: 'category' },
                    { id: 'sizeFilter', dataKey: 'size' }
                ]
            });
        });
    </script>
</body>

</html>
