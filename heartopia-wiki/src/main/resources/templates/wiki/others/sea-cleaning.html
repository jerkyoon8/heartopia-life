<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/common-head :: common_head}"></th:block>
    <script src="/js/wiki-filter.js?v=2.9" defer></script>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="mw-body">
        <div class="page-header">
            <i class="fas fa-water fa-2x text-info"></i>
            <h1>바다 청소 도감 (Sea Cleaning Collection)
                <span sec:authorize="hasRole('ADMIN')">
                    <button type="button" class="btn btn-primary btn-sm rounded-pill shadow-sm ms-3 btn-admin-add"
                            data-bs-toggle="modal" data-bs-target="#addSeaCleaningModal"
                            style="font-size: 0.5em; vertical-align: middle;">
                        <i class="fas fa-plus me-1"></i> 바다 청소 추가
                    </button>
                </span>
            </h1>
        </div>
        <p class="text-secondary mb-4">바다 청소로 발견할 수 있는 조개와 고둥의 도감 정보입니다.</p>

        <div class="wiki-filter-container">
            <div class="filter-top-tier">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="바다 청소 이름 검색...">
                </div>

                <div th:replace="~{fragments/wiki-components :: quickEventFilter}"></div>

                <div class="toggle-switch-wrapper"
                     style="box-shadow: none; border-color: transparent; background: transparent; padding: 0;">
                    <label class="toggle-switch-label">
                        <label class="switch">
                            <input type="checkbox" id="btn-hide-collected">
                            <span class="slider"></span>
                        </label>
                        <i class="fas fa-eye-slash text-secondary"></i> 수집된 항목 숨기기
                    </label>
                </div>

                <button type="button" class="btn-filter-toggle"
                        onclick="document.getElementById('advancedFilters').classList.toggle('show')">
                    <i class="fas fa-sliders-h"></i> 상세 옵션 <i class="fas fa-chevron-down ms-1"></i>
                </button>

                <button type="button" id="resetBtn" class="btn-reset-icon" title="초기화">
                    <i class="fas fa-undo"></i>
                </button>
            </div>

            <div class="filter-advanced-tier" id="advancedFilters">
                <div class="advanced-section">
                    <div class="section-label"><i class="fas fa-filter"></i> 조건 검색</div>
                    <div class="advanced-controls-box">
                        <div th:replace="~{fragments/wiki-components :: eventFilter}"></div>

                        <div class="filter-select-wrapper filter-multi-select-wrapper" id="levelFilter">
                            <span class="prefix">레벨</span>
                            <div class="multi-select-trigger" id="levelTrigger">
                                <span class="trigger-label">모든 레벨</span>
                                <i class="fas fa-chevron-down ms-2 text-muted" style="font-size: 0.75rem;"></i>
                            </div>
                            <div class="multi-select-dropdown" id="levelDropdown">
                                <div class="dropdown-opt">
                                    <label><input type="checkbox" value="all" checked> 모든 레벨</label>
                                </div>
                                <div class="dropdown-div"></div>
                                <div class="dropdown-opt" th:each="i : ${#numbers.sequence(1, 6)}">
                                    <label>
                                        <input type="checkbox" class="lvl-checkbox" th:value="${i}">
                                        [[${'Lv.' + i}]]
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="filter-select-wrapper">
                            <span class="prefix">날씨</span>
                            <select id="weatherFilter">
                                <option value="all">모든 날씨</option>
                                <option value="상시">상시</option>
                                <option value="미공개">미공개</option>
                            </select>
                        </div>

                        <div class="filter-select-wrapper" style="padding-right: 8px;">
                            <span class="prefix">시간</span>
                            <div style="display:flex; align-items:center; gap: 4px;">
                                <select id="timeStartFilter" class="form-control form-control-sm"
                                        style="border:none; outline:none; background:transparent; padding:0 4px; font-weight: 500; font-family: inherit; width: 55px;">
                                    <option value="" selected>시작</option>
                                    <option value="00:00">00시</option>
                                    <option value="06:00">06시</option>
                                    <option value="12:00">12시</option>
                                    <option value="18:00">18시</option>
                                </select>
                                <span style="color:var(--text-color); font-weight:bold; opacity: 0.5;">~</span>
                                <select id="timeEndFilter" class="form-control form-control-sm"
                                        style="border:none; outline:none; background:transparent; padding:0 4px; font-weight: 500; font-family: inherit; width: 55px;">
                                    <option value="" selected>종료</option>
                                    <option value="06:00">06시</option>
                                    <option value="12:00">12시</option>
                                    <option value="18:00">18시</option>
                                    <option value="24:00">24시</option>
                                </select>
                                <label style="display:flex; align-items:center; gap: 4px; font-size: 0.8rem; margin-left: 6px; cursor: pointer;">
                                    <input type="checkbox" id="btn-include-always" checked
                                           style="accent-color: var(--link-color); width: 14px; height: 14px; cursor: pointer;">
                                    <span style="white-space: nowrap;">상시 포함</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="advanced-divider"></div>

                <div class="advanced-section">
                    <div class="section-label"><i class="fas fa-sort-amount-down"></i> 결과 정렬 및 보기</div>
                    <div class="advanced-controls-box">
                        <div th:replace="~{fragments/wiki-components :: sortAndReset}"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="wiki-grid-layout" id="wikiGrid">
            <div class="no-results" id="noResults">
                <i class="fas fa-search fa-3x mb-3 text-muted"></i>
                <p>검색 결과가 없습니다.</p>
            </div>

            <div th:each="item, iterStat : ${seaCleaningList}" class="wiki-item-card sync-item"
                 th:data-id="${iterStat.index}"
                 th:data-sync-key="'sea_cleaning_' + ${item.name}"
                 th:data-has-mastery="${item.hasMasteryData() ? 'true' : 'false'}"
                 th:data-name="${item.name}"
                 th:data-level="${item.level}"
                 th:data-price="${item.prices[0]}"
                 th:data-weather="${item.weather}"
                 th:data-time="${item.displayTime}"
                 th:data-event="${item.eventName != null ? item.eventName : ''}">

                <div class="wiki-item-image sync-container">
                    <div class="sync-check-btn" title="수집 처리 (0별)"><i class="fas fa-check"></i></div>
                    <div class="sync-mastery-btn"
                         th:classappend="${item.hasMasteryData() ? '' : ' disabled'}"
                         th:attr="aria-disabled=${item.hasMasteryData() ? 'false' : 'true'}"
                         th:title="${item.hasMasteryData() ? '명인 체크' : '명인 정보 없음'}"
                         aria-pressed="false"><i class="fas fa-medal"></i></div>

                    <img th:if="${item.imageUrl != null and !item.imageUrl.isEmpty()}"
                         th:src="${item.imageUrl}" th:alt="${item.name}" loading="lazy" decoding="async"
                         style="max-height: 100px; object-fit: contain;">
                    <i class="fas fa-water fa-4x text-info fallback-icon"
                       th:style="${item.imageUrl != null and !item.imageUrl.isEmpty() ? 'display: none; opacity: 0.7;' : 'display: flex; opacity: 0.7;'}"></i>
                </div>

                <div class="wiki-item-info">
                    <div class="wiki-item-name mb-0">
                        <span th:text="${item.name}">조개 이름</span>
                    </div>
                    <div class="sync-stars">
                        <i class="fas fa-star sync-star-icon" data-val="1"></i>
                        <i class="fas fa-star sync-star-icon" data-val="2"></i>
                        <i class="fas fa-star sync-star-icon" data-val="3"></i>
                        <i class="fas fa-star sync-star-icon" data-val="4"></i>
                        <i class="fas fa-star sync-star-icon" data-val="5"></i>
                    </div>
                    <div th:if="${item.location != null and !item.location.isBlank() and item.location != '미공개' and item.location != '바다 청소'}">
                        <span class="wiki-item-tag">
                            <i class="fas fa-map-marker-alt me-1"></i>
                            <span th:text="${item.location}">장소</span>
                        </span>
                    </div>
                </div>

                <table class="wiki-item-stats">
                    <tr>
                        <td class="stat-label">요구 레벨</td>
                        <td class="stat-value"><span th:text="${item.level}">1</span> Lv</td>
                    </tr>
                    <tr>
                        <td class="stat-label">날씨</td>
                        <td class="stat-value">
                            <span th:if="${item.weather != null and item.weather.contains('해')}" title="맑음"><i
                                    class="fas fa-sun text-warning me-1"></i></span>
                            <span th:if="${item.weather != null and item.weather.contains('비')}" title="비"><i
                                    class="fas fa-cloud-showers-heavy text-primary me-1"></i></span>
                            <span th:if="${item.weather != null and item.weather.contains('무지개')}" title="무지개"><i
                                    class="fas fa-rainbow text-info me-1"></i></span>
                            <span th:if="${item.weather == '상시'}" th:text="${item.weather}"></span>
                            <small class="text-muted" th:if="${item.weather != '상시'}"
                                   th:text="${item.weather != null ? item.weather : '미공개'}"></small>
                        </td>
                    </tr>
                    <tr>
                        <td class="stat-label">시간</td>
                        <td class="stat-value" th:text="${item.displayTime}">상시</td>
                    </tr>
                    <tr>
                        <td class="stat-label">숙련도</td>
                        <td class="stat-value" th:text="${item.proficiency != null ? item.proficiency : '-'}">-</td>
                    </tr>
                </table>

                <div th:replace="~{fragments/wiki-components :: priceDisplay(${item.prices})}"></div>

                <div sec:authorize="hasRole('ADMIN')" class="text-end mt-2" style="border-top:1px solid #eee;padding-top:8px;">
                    <button type="button" class="btn btn-outline-warning btn-sm btn-admin-edit"
                            data-modal-target="addSeaCleaningModal" data-edit-title="바다 청소 수정"
                            th:data-item="${'{&quot;id&quot;:' + item.id + ',&quot;name&quot;:&quot;' + item.name + '&quot;,&quot;level&quot;:' + item.level + ',&quot;time&quot;:&quot;' + (item.time != null ? item.time : '') + '&quot;,&quot;weather&quot;:&quot;' + (item.weather != null ? item.weather : '') + '&quot;,&quot;location&quot;:&quot;' + (item.location != null ? item.location : '') + '&quot;,&quot;eventName&quot;:&quot;' + (item.eventName != null ? item.eventName : '') + '&quot;,&quot;proficiency&quot;:' + (item.proficiency != null ? item.proficiency : 'null') + ',&quot;goldPrice1&quot;:' + (item.goldPrice1 != null ? item.goldPrice1 : 'null') + ',&quot;goldPrice2&quot;:' + (item.goldPrice2 != null ? item.goldPrice2 : 'null') + ',&quot;goldPrice3&quot;:' + (item.goldPrice3 != null ? item.goldPrice3 : 'null') + ',&quot;goldPrice4&quot;:' + (item.goldPrice4 != null ? item.goldPrice4 : 'null') + ',&quot;goldPrice5&quot;:' + (item.goldPrice5 != null ? item.goldPrice5 : 'null') + ',&quot;sortOrder&quot;:' + (item.sortOrder != null ? item.sortOrder : 'null') + ',&quot;masteryBeginnerMax&quot;:' + (item.masteryBeginnerMax != null ? item.masteryBeginnerMax : 'null') + ',&quot;masteryIntroMin&quot;:' + (item.masteryIntroMin != null ? item.masteryIntroMin : 'null') + ',&quot;masteryExpertMin&quot;:' + (item.masteryExpertMin != null ? item.masteryExpertMin : 'null') + ',&quot;masteryMasterMin&quot;:' + (item.masteryMasterMin != null ? item.masteryMasterMin : 'null') + ',&quot;imageUrl&quot;:&quot;' + (item.imageUrl != null ? item.imageUrl : '') + '&quot;}'}">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button type="button" class="btn btn-outline-danger btn-sm btn-admin-delete"
                            th:data-name="${item.name}"
                            th:data-delete-url="${'/wiki/admin/data/sea-cleaning/delete/' + item.id}">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="wiki-table-container" id="wikiTable">
            <table class="wiki-table-layout">
                <thead>
                    <tr>
                        <th></th>
                        <th>이름</th>
                        <th>레벨</th>
                        <th>날씨</th>
                        <th>시간</th>
                        <th>숙련도</th>
                        <th>판매가(1★)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item, iterStat : ${seaCleaningList}" class="wiki-table-row sync-item"
                        th:data-id="${iterStat.index}"
                        th:data-sync-key="'sea_cleaning_' + ${item.name}"
                        th:data-has-mastery="${item.hasMasteryData() ? 'true' : 'false'}"
                        th:data-name="${item.name}"
                        th:data-level="${item.level}"
                        th:data-price="${item.prices[0]}"
                        th:data-weather="${item.weather}"
                        th:data-time="${item.displayTime}"
                        th:data-event="${item.eventName != null ? item.eventName : ''}">
                        <td>
                            <img th:if="${item.imageUrl != null and !item.imageUrl.isEmpty()}"
                                 th:src="${item.imageUrl}" th:alt="${item.name}" class="table-thumb"
                                 loading="lazy" decoding="async">
                            <div th:unless="${item.imageUrl != null and !item.imageUrl.isEmpty()}"
                                 class="table-thumb-placeholder"><i class="fas fa-water"></i></div>
                        </td>
                        <td>
                            <span class="table-name-link">
                                <span th:text="${item.name}">이름</span>
                            </span>
                        </td>
                        <td th:text="${item.level}">1</td>
                        <td th:text="${item.weather != null ? item.weather : '미공개'}">상시</td>
                        <td th:text="${item.displayTime}">상시</td>
                        <td th:text="${item.proficiency != null ? item.proficiency : '-'}">-</td>
                        <td class="table-price" th:text="${item.prices[0] != null ? item.prices[0] : '-'}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div sec:authorize="hasRole('ADMIN')">
            <div class="modal fade" id="addSeaCleaningModal" tabindex="-1" data-add-title="새 바다 청소 추가">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content" style="border-radius:20px;border:none;box-shadow:0 20px 60px rgba(0,0,0,0.15);">
                        <div class="modal-header" style="background:var(--modal-header-bg);color:var(--modal-header-text);border-radius:20px 20px 0 0;padding:20px 24px;">
                            <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i>새 바다 청소 추가</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" style="filter:invert(1);"></button>
                        </div>
                        <form th:action="@{/wiki/admin/data/sea-cleaning/add}" method="post" enctype="multipart/form-data"
                              data-add-action="/wiki/admin/data/sea-cleaning/add"
                              data-update-action="/wiki/admin/data/sea-cleaning/update"
                              data-mastery-fields>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="id" value="" />
                            <input type="hidden" name="masteryFieldsPresent" value="true" />
                            <div class="modal-body" style="padding:24px;">
                                <div class="row g-3">
                                    <div class="col-md-6"><label class="form-label fw-bold">이름 *</label><input type="text" name="name" class="form-control" required></div>
                                    <div class="col-md-3"><label class="form-label fw-bold">레벨 *</label><input type="number" name="level" class="form-control" required></div>
                                    <div class="col-md-3"><label class="form-label fw-bold">정렬</label><input type="number" name="sortOrder" class="form-control"></div>
                                    <div class="col-md-4"><label class="form-label fw-bold">날씨</label><input type="text" name="weather" class="form-control" placeholder="상시"></div>
                                    <div class="col-md-4"><label class="form-label fw-bold">시간</label><input type="text" name="time" class="form-control" placeholder="0~6 / 12~24"></div>
                                    <div class="col-md-4"><label class="form-label fw-bold">숙련도</label><input type="number" name="proficiency" class="form-control" placeholder="60"></div>
                                    <div class="col-md-6"><label class="form-label fw-bold">장소</label><input type="text" name="location" class="form-control" placeholder="미공개"></div>
                                    <div class="col-md-6"><label class="form-label fw-bold">이벤트</label><input type="text" name="eventName" class="form-control" placeholder="예: 고래 탐사 시즌"></div>
                                    <div class="col-12"><label class="form-label fw-bold">판매가 (1★~5★)</label>
                                        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;">
                                            <input type="number" name="goldPrice1" class="form-control" placeholder="1★">
                                            <input type="number" name="goldPrice2" class="form-control" placeholder="2★">
                                            <input type="number" name="goldPrice3" class="form-control" placeholder="3★">
                                            <input type="number" name="goldPrice4" class="form-control" placeholder="4★">
                                            <input type="number" name="goldPrice5" class="form-control" placeholder="5★">
                                        </div>
                                    </div>
                                    <div class="col-12"><label class="form-label fw-bold">명인 정보</label>
                                        <div class="mastery-input-grid">
                                            <input type="number" min="0" name="masteryBeginnerMax" class="form-control" placeholder="초보자 최대">
                                            <input type="number" min="0" name="masteryIntroMin" class="form-control" placeholder="입문자 최소">
                                            <input type="number" min="0" name="masteryExpertMin" class="form-control" placeholder="숙련자 최소">
                                            <input type="number" min="0" name="masteryMasterMin" class="form-control" placeholder="명인 최소">
                                        </div>
                                        <div class="invalid-feedback mastery-feedback"></div>
                                    </div>
                                    <div class="col-md-8"><label class="form-label fw-bold">이미지 등록 방식</label>
                                        <div class="mb-2">
                                            <label class="form-check form-check-inline">
                                                <input class="form-check-input" type="radio" name="imageMode" value="DEFAULT" checked> 기본 이미지
                                            </label>
                                            <label class="form-check form-check-inline">
                                                <input class="form-check-input" type="radio" name="imageMode" value="UPLOAD"> 직접 업로드
                                            </label>
                                        </div>
                                        <div class="img-upload-wrapper" style="display:none;">
                                            <input type="file" name="imageFile" class="form-control img-file-input" accept="image/*">
                                            <input type="hidden" name="existingImageUrl" />
                                            <div class="img-preview mt-2" style="display:none;"><img src="" alt="미리보기" style="max-height:80px;object-fit:contain;border-radius:8px;"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                                <button type="submit" class="btn btn-admin-submit text-white" style="background:var(--modal-header-bg);">추가하기</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                new WikiFilter({
                    gridId: 'wikiGrid',
                    tableId: 'wikiTable',
                    itemSelector: '.wiki-item-card',
                    filters: [
                        { id: 'eventFilter', dataKey: 'event', type: 'event-multi' },
                        { id: 'levelFilter', dataKey: 'level', type: 'multi' },
                        { id: 'weatherFilter', dataKey: 'weather' }
                    ]
                });
            });
        </script>
        <script src="/js/admin-data.js?v=1.3" defer></script>
    </div>
</body>

</html>
