<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common-head :: common_head}"></th:block>
    <title>도감 캐시 관리 - 두두타 도감</title>
    <style>
        .cache-admin { width: min(980px, calc(100% - 32px)); margin: 120px auto 56px; }
        .cache-card { padding: 24px; border: 1px solid var(--border-color); border-radius: 18px;
            background: var(--card-bg); box-shadow: 0 8px 28px var(--shadow); }
        .cache-admin h1 { margin-bottom: 24px; font-size: 28px; font-weight: 800; }
        .cache-card p { color: var(--text-muted); }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="cache-admin">
    <h1><i class="fas fa-rotate me-2"></i>도감 캐시 관리</h1>
    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <section class="cache-card">
        <p>수정한 도감 정보가 표시되지 않을 때 캐시를 비워 주세요. 로그인 상태와 수집 기록은 유지됩니다.</p>
        <form th:action="@{/wiki/admin/catalog-cache/clear}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-primary">도감 캐시 비우기</button>
        </form>
    </section>
</main>
</body>
</html>
